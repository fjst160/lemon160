<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet"
href="{{ site.baseurl }}/assets/style.css">
</head>
<body>

<h1>{{ page.title }}</h1>

<p>
{{ page.length }}｜
{{ page.rating }}｜
{{ page.setting }}
</p>

{% if page.tags %}
<p>

#{{ tag }}
{% endfor %}
</p>
{% endif %}

<hr>

{{ content }}

<hr>

<p>
<a href="{{ site.baseurl }}/novels.html">
作品一覧へ戻る
</a>
</p>

</body>
</html>
